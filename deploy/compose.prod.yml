name: interior-prod
services:
  db:
    image: mysql:8.4
    container_name: interior-mysql-prod
    env_file:
      - ./env/prod.env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - interior_mysql_prod:/var/lib/mysql
    ports:
      - "23306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  migrate:
    image: interior-backend:dev
    env_file:
      - ./env/prod.env
    environment:
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "backend.scripts.init_db"]
    restart: "no"

  backend:
    image: interior-backend:dev
    container_name: interior-backend-prod
    env_file:
      - ./env/prod.env
    environment:
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8000"
    restart: unless-stopped

volumes:
  interior_mysql_prod:
