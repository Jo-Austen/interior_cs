name: interior-test

services:
  db:
    image: mysql:8.4
    container_name: interior-mysql-test
    env_file:
      - /srv/app-test/env/test.env
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - /srv/app-test/data/mysql:/var/lib/mysql
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  migrate:
    image: interior-backend:dev
    env_file:
      - /srv/app-test/env/test.env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "backend.scripts.init_db"]
    restart: "no"

  backend:
    image: interior-backend:dev
    container_name: interior-backend-test
    env_file:
      - /srv/app-test/env/test.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8081:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: interior-frontend:dev
    container_name: interior-frontend-test
    env_file:
      - /srv/app-test/env/test.env
    ports:
      - "3001:3000"
    restart: unless-stopped

  volumes:
    interior-prod-mysql-data: