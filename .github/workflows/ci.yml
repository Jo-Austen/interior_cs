name: ci

on:
  push:
    branches:
      - "feature/**"
      - "Master"
  pull_request:
    branches:
      - "Master"
  workflow_dispatch:

jobs:
  ci_build_and_test:
    runs-on: macos-ci-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ====== (可选) 单元测试：你后面把真实命令替换到这里 ======
      # - name: Unit tests
      #   shell: bash
      #   run: |
      #     set -euo pipefail
      #     ./scripts/ci_test.sh

      - name: Build images (backend/frontend) for verification
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.test.yml build backend frontend
