name: ci

on:
  push:
    branches:
      - "feature/**"
      - "Master"
  pull_request:
    branches:
      - "Master"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    # 先把 TEST 跑通：从 Environment(test) 读取 SSH_HOST/SSH_USER/SSH_KEY
    environment: test
    runs-on: [self-hosted, macos-ci-runner]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Vars
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Cleanup docker builder cache (pre)
        shell: bash
        run: |
          set -euo pipefail
          docker builder prune -af || true

      - name: Build images (backend/frontend)
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.test.yml build backend frontend
          docker pull mysql:8.4
      
      - name: Run unit tests (backend)
        shell: bash
        run: |
          set -euo pipefail
          # 用刚刚 build 出来的 backend 镜像跑 pytest，避免本机 Python 依赖不一致
          docker compose -f deploy/compose.test.yml run --rm backend \
          sh -lc "python3 -m pytest -q backend/tests"

      - name: Save images to tar (local)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          docker save mysql:8.4 interior-backend:dev interior-frontend:dev \
            -o "dist/base-images-${GITHUB_SHA::7}.tar"
          ls -lh dist

      # =========================
      # Deploy TEST (feature/*)
      # =========================
      - name: TEST - SSH check
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "echo ssh_ok"

      - name: TEST - Upload tar
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          SHA7="${{ steps.vars.outputs.sha7 }}"
          TAR_LOCAL="dist/base-images-${SHA7}.tar"
          TAR_REMOTE="/tmp/base-images-test-${SHA7}-${GITHUB_RUN_ID}.tar"

          scp -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes \
            "$TAR_LOCAL" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${TAR_REMOTE}"

      - name: TEST - Upload compose
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes \
            "deploy/compose.cd.test.yml" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/app-test/compose.yml"

      - name: TEST - Remote docker load + delete tar
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          SHA7="${{ steps.vars.outputs.sha7 }}"
          TAR_REMOTE="/tmp/base-images-test-${SHA7}-${GITHUB_RUN_ID}.tar"

          ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << EOF
              set -euo pipefail
              docker load -i "${TAR_REMOTE}"
              rm -f "${TAR_REMOTE}"
          EOF

      - name: TEST - Remote compose up
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << EOF
              set -euo pipefail
              docker compose -p app_test -f /srv/app-test/compose.yml up -d --force-recreate
          EOF

      - name: TEST - Remote status check
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << EOF
              set -euo pipefail
              docker compose -p app_test -f /srv/app-test/compose.yml ps
          EOF

      # =========================
      # PROD (Master) - 先别启用
      # 你说先把 test 跑通；等 test 稳了再拆成两个 job 或切到 repo secrets。
      # =========================
      # - name: PROD - ...
      #   if: >
      #     github.event_name != 'pull_request' &&
      #     steps.vars.outputs.branch == 'Master'
      #   ...

      - name: Cleanup local dist (post)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist || true

      - name: Cleanup docker builder cache (post)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker builder prune -af || true
