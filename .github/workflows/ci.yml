name: ci

on:
  push:
    branches:
      - "feature/**"
      - "Master"
  pull_request:
    branches:
      - "Master"
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: [self-hosted, macos-ci-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vars
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # 防止 Docker Desktop 重启/BuildKit snapshot 损坏
      - name: Cleanup docker builder cache (pre)
        shell: bash
        run: |
          set -euo pipefail
          docker builder prune -af || true

      - name: Build images (backend/frontend)
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.test.yml build backend frontend
          docker pull mysql:8.4

      - name: Save images to tar (local)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save mysql:8.4 interior-backend:dev interior-frontend:dev \
            -o "dist/base-images-${GITHUB_SHA::7}.tar"
          ls -lh dist

      # ====== deploy to test (feature/*) ======
      - name: Deploy to TEST (feature/*)
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          SHA7="${{ steps.vars.outputs.sha7 }}"
          TAR_LOCAL="dist/base-images-${SHA7}.tar"
          TAR_REMOTE="/tmp/base-images-test-${SHA7}.tar"

          scp "$TAR_LOCAL" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${TAR_REMOTE}"
          scp "deploy/compose.cd.test.yml" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/app-test/compose.yml"

          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << EOF
            set -euo pipefail
            docker load -i ${TAR_REMOTE}
            rm -f ${TAR_REMOTE}
            docker compose -f /srv/app-test/compose.yml up -d --force-recreate
            docker compose -f /srv/app-test/compose.yml ps
            docker image prune -f
          EOF

      # ====== deploy to prod (Master) ======
      - name: Deploy to PROD (Master)
        if: >
          github.event_name != 'pull_request' &&
          steps.vars.outputs.branch == 'Master'
        shell: bash
        run: |
          set -euo pipefail
          SHA7="${{ steps.vars.outputs.sha7 }}"
          TAR_LOCAL="dist/base-images-${SHA7}.tar"
          TAR_REMOTE="/tmp/base-images-prod-${SHA7}.tar"

          scp "$TAR_LOCAL" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${TAR_REMOTE}"
          scp "deploy/compose.cd.prod.yml" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/app-prod/compose.yml"

          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << EOF
            set -euo pipefail
            docker load -i ${TAR_REMOTE}
            rm -f ${TAR_REMOTE}
            docker compose -f /srv/app-prod/compose.yml up -d --force-recreate
            docker compose -f /srv/app-prod/compose.yml ps
            docker image prune -f
          EOF

      - name: Cleanup docker builder cache (post)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker builder prune -af || true
