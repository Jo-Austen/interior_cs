name: ci

on:
  push:
    branches:
      - "feature/**"
      - "Master"
  pull_request:
    branches:
      - "Master"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: [self-hosted, macos-ci-runner]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vars
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Cleanup docker builder cache (pre)
        shell: bash
        run: |
          set -euo pipefail
          docker builder prune -af || true

      - name: Build images (backend/frontend)
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.test.yml build backend frontend
          docker pull mysql:8.4

      - name: Save images to tar (local)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          docker save mysql:8.4 interior-backend:dev interior-frontend:dev \
            -o "dist/base-images-${GITHUB_SHA::7}.tar"
          ls -lh dist

      # =========================
      # Deploy TEST (feature/*)
      # =========================
      - name: TEST - Prepare env vars
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          SHA7="${{ steps.vars.outputs.sha7 }}"
          echo "SHA7=${SHA7}" >> "$GITHUB_ENV"
          echo "SSH_OPTS=-o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          echo "TAR_LOCAL=dist/base-images-${SHA7}.tar" >> "$GITHUB_ENV"
          echo "TAR_REMOTE=/tmp/base-images-test-${SHA7}-${GITHUB_RUN_ID}.tar" >> "$GITHUB_ENV"
          echo "REMOTE_COMPOSE=/srv/app-test/compose.yml" >> "$GITHUB_ENV"
          echo "REMOTE_PROJECT=app_test" >> "$GITHUB_ENV"
          echo "REMOTE_DIR=/srv/app-test" >> "$GITHUB_ENV"
          echo "LOCAL_COMPOSE=deploy/compose.cd.test.yml" >> "$GITHUB_ENV"

      - name: TEST - SSH check
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "echo ssh_ok"

      - name: TEST - Upload tar
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          scp ${SSH_OPTS} "${TAR_LOCAL}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${TAR_REMOTE}"

      - name: TEST - Upload compose
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          scp ${SSH_OPTS} "${LOCAL_COMPOSE}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_COMPOSE}"

      - name: TEST - Remote docker load + delete tar
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << EOF
            set -euo pipefail
            docker load -i "${TAR_REMOTE}"
            rm -f "${TAR_REMOTE}"
          EOF

      - name: TEST - Remote compose up
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << EOF
            set -euo pipefail
            docker compose -p "${REMOTE_PROJECT}" -f "${REMOTE_COMPOSE}" up -d --force-recreate
          EOF

      - name: TEST - Remote status check
        if: >
          github.event_name != 'pull_request' &&
          startsWith(steps.vars.outputs.branch, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << EOF
            set -euo pipefail
            docker compose -p "${REMOTE_PROJECT}" -f "${REMOTE_COMPOSE}" ps
          EOF

      # =========================
      # Deploy PROD (Master)
      # =========================
      - name: PROD - Prepare env vars
        if: >
          github.event_name != 'pull_request' &&
          steps.vars.outputs.branch == 'Master'
        shell: bash
        run: |
          set -euo pipefail
          SHA7="${{ steps.vars.outputs.sha7 }}"
          echo "SHA7=${SHA7}" >> "$GITHUB_ENV"
          echo "SSH_OPTS=-o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          echo "TAR_LOCAL=dist/base-images-${SHA7}.tar" >> "$GITHUB_ENV"
          echo "TAR_REMOTE=/tmp/base-images-prod-${SHA7}-${GITHUB_RUN_ID}.tar" >> "$GITHUB_ENV"
          echo "REMOTE_COMPOSE=/srv/app-prod/compose.yml" >> "$GITHUB_ENV"
          echo "REMOTE_PROJECT=app_prod" >> "$GITHUB_ENV"
          echo "REMOTE_DIR=/srv/app-prod" >> "$GITHUB_ENV"
          echo "LOCAL_COMPOSE=deploy/compose.cd.prod.yml" >> "$GITHUB_ENV"

      - name: PROD - SSH check
        if: >
          github.event_name != 'pull_request' &&
          steps.vars.outputs.branch == 'Master'
        shell: bash
        run: |
          set -euo pipefail
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "echo ssh_ok"

      - name: PROD - Upload tar
        if: >
          github.event_name != 'pull_request' &&
          steps.vars.outputs.branch == 'Master'
        shell: bash
        run: |
          set -euo pipefail
          scp ${SSH_OPTS} "${TAR_LOCAL}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${TAR_REMOTE}"

      - name: PROD - Upload compose
        if: >
          github.event_name != 'pull_request' &&
          steps.vars.outputs.branch == 'Master'
        shell: bash
        run: |
          set -euo pipefail
          scp ${SSH_OPTS} "${LOCAL_COMPOSE}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${REMOTE_COMPOSE}"

      - name: PROD - Remote docker load + delete tar
        if: >
          github.event_name != 'pull_request' &&
          steps.vars.outputs.branch == 'Master'
        shell: bash
        run: |
          set -euo pipefail
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << EOF
            set -euo pipefail
            docker load -i "${TAR_REMOTE}"
            rm -f "${TAR_REMOTE}"
          EOF

      - name: PROD - Remote compose up
        if: >
          github.event_name != 'pull_request' &&
          steps.vars.outputs.branch == 'Master'
        shell: bash
        run: |
          set -euo pipefail
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << EOF
            set -euo pipefail
            docker compose -p "${REMOTE_PROJECT}" -f "${REMOTE_COMPOSE}" up -d --force-recreate
          EOF

      - name: PROD - Remote status check
        if: >
          github.event_name != 'pull_request' &&
          steps.vars.outputs.branch == 'Master'
        shell: bash
        run: |
          set -euo pipefail
          ssh ${SSH_OPTS} "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << EOF
            set -euo pipefail
            docker compose -p "${REMOTE_PROJECT}" -f "${REMOTE_COMPOSE}" ps
          EOF

      - name: Cleanup local dist (post)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist || true

      - name: Cleanup docker builder cache (post)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker builder prune -af || true
